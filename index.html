<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      color: #ddd;
      background-color: #222;
    }
    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    img {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50vmin;
      height: 50vmin;
      border: 1px solid #ddd;
      box-sizing: border-box;
      background-color: #000;
      font-size: 4vmin;
    }
  </style>
  <title>Cross-Project Access</title>
</head>
<body>
  <main>
    <img src="https://github.com/jazyx/Memory/blob/main/public/images/animals/bear.jpg" alt="Direct Path to bear image">
    <img src="/Memory/blob/main/public/images/animals/bear.jpg" alt="Relative Path to bear image">
    <img src="https://raw.githubusercontent.com/jazyx/Memory/refs/heads/main/public/images/animals/bear.jpg" alt="Path to raw image" title="Path to raw image">
    <img src="https://raw.githubusercontent.com/WoodsForTheTrees/blue/refs/heads/master/public/img/blue.jpg" alt="Path to image in a different organization" title="Image in a different organization">
  </main>
</body>
</html>
